    <script>
      const tl = gsap.timeline({ paused: true });
      const C = window.CARTE;
      // trois cadrages du rush ; l'avatar est centré à x = 982 px dans l'image 1080p
      const PLEIN = { cadre: { left: 0, top: 0, width: 1920, height: 1080, borderRadius: 0, boxShadow: "0 0 0 0 rgba(32,26,100,0)" }, video: { left: 0, top: 0, width: 1920, height: 1080 } };

      const vers = (etat, t, d = 0.6) => {
        tl.to("#cadre", { ...etat.cadre, duration: d, ease: "power3.inOut" }, t);
        tl.to(".rush", { ...etat.video, duration: d, ease: "power3.inOut" }, t);
      };
      gsap.set("#cadre", PLEIN.cadre);
      gsap.set(".rush", PLEIN.video);

      vers(DROITE, 0.5, 0.7);

      vers(COLONNE, 15.0, 0.01);

      vers(PLEIN, C(44.6), 0.5);

      vers(PLEIN, C(153.4), 0.5);
      vers(COLONNE, C(157.25), 0.5);
      window.__timelines["main"] = tl;
