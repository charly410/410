<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #h-question { left: 1000px; top: 170px; width: 500px; height: 110px; display: grid; place-items: center; background: var(--indigo); }
        #h-question .titre { color: #fff; font-size: 40px; }
        #h-liens { position: absolute; left: 600px; top: 280px; width: 1300px; height: 240px; }
        .h-br { top: 500px; width: 285px; height: 270px; padding: 28px 24px; text-align: center; }
        .h-br .cas { font-weight: 700; font-size: 26px; color: var(--gris); }
        .h-br .sig { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 46px; color: var(--profond); margin-top: 26px; line-height: 1.1; }
        .h-br .det { font-size: 22px; color: var(--gris); margin-top: 12px; font-weight: 600; }
        #h-b1 { left: 645px; } #h-b2 { left: 955px; } #h-b3 { left: 1265px; } #h-b4 { left: 1575px; }
        #h-robots { left: 830px; top: 810px; }
        #h-article { position: absolute; left: 600px; top: 900px; width: 1300px; display: flex; justify-content: center; align-items: center; gap: 18px; }
        #h-article .badge { position: relative; }
      </style>
      <div id="root" data-composition-id="arbre" data-width="1920" data-height="1080">
        <div class="carte" id="h-question"><span class="titre">Que devient la page ?</span></div>
        <svg id="h-liens" viewBox="0 0 1300 240">
          <path class="h-l" d="M650 0 V 90 H 187 V 220" fill="none" stroke="#929cbf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path class="h-l" d="M650 0 V 90 H 497 V 220" fill="none" stroke="#929cbf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path class="h-l" d="M650 0 V 90 H 807 V 220" fill="none" stroke="#929cbf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path class="h-l" d="M650 0 V 90 H 1117 V 220" fill="none" stroke="#929cbf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="carte h-br" id="h-b1"><div class="cas">Supprimée pour de bon</div><div class="sig">410</div></div>
        <div class="carte h-br" id="h-b2"><div class="cas">Remplacée</div><div class="sig">301</div><div class="det">vers la page équivalente</div></div>
        <div class="carte h-br" id="h-b3"><div class="cas">En ligne, hors Google</div><div class="sig">noindex</div><div class="det">ou X-Robots-Tag</div></div>
        <div class="carte h-br" id="h-b4"><div class="cas">Privée</div><div class="sig">Mot de passe</div></div>
        <div class="badge o" id="h-robots">Pas de blocage robots.txt avant la désindexation</div>
        <div id="h-article">
          <span class="badge i">L'arbre complet est dans l'article, lien sous la vidéo</span>
          <svg id="h-fleche" width="50" height="60" viewBox="0 0 50 60"><path d="M25 4 V 50 M8 34 L25 52 L42 34" fill="none" stroke="#31249f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
      </div>
      <script>
        (function () {
          const T = (v) => window.CARTE(v) - window.DEBUT["arbre"];
          const tl = gsap.timeline({ paused: true });
          // « Un signal clair… » passe en plein écran sur le rush ; l'arbre se construit ensuite, sur « L'arbre de décision »
          const B = T(157.3);
          tl.fromTo("#h-question", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, B);
          document.querySelectorAll("#h-liens .h-l").forEach((p, i) => {
            const L = p.getTotalLength();
            tl.fromTo(p, { attr: { "stroke-dasharray": L, "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, B + 0.35 + i * 0.12);
          });
          tl.fromTo([".h-br"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.18, ease: "power3.out" }, B + 0.75);
          tl.fromTo("#h-robots", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, T(158.6));
          // « L'arbre de décision complet est dans notre article, en lien juste en dessous »
          tl.fromTo("#h-article", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(159.4));
          tl.fromTo("#h-fleche", { y: -6 }, { y: 6, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 5 }, T(160.1));
          window.__timelines["arbre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
