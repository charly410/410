<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Miniature déréférencement</title>
<style>
@font-face { font-family: 'Inter'; src: url('assets/inter-latin.woff2') format('woff2'); font-weight: 100 900; }
:root { --jaune: #F49C16; --jaune-clair: #FFB94A; --bleu: #31249F; --bleu-fonce: #1F1672; --bleu-clair: #5B4DD1; --rouge: #E5484D; --rouge-pale: #FDECEC; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { font-family: 'Inter', sans-serif; position: relative;
  background: radial-gradient(circle at 30% 55%, var(--bleu-clair) 0, var(--bleu) 40%, var(--bleu-fonce) 100%); }
.abs { position: absolute; }
/* titre : un seul mot */
#word { left: 40px; top: 18px; font-size: 200px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; color: var(--jaune);
  transform: rotate(-3deg); text-shadow: 0 10px 0 var(--bleu-fonce), 0 18px 40px rgba(0,0,0,.45); }
/* le résultat Google qu'on efface */
#card { left: 50px; top: 250px; width: 640px; transform: rotate(-3deg); }
#bar { width: 640px; height: 92px; border-radius: 46px; background: #fff; display: flex; align-items: center; gap: 18px; padding: 0 32px;
  font-size: 44px; font-weight: 800; color: #15131F; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
#res { position: relative; margin-top: 22px; width: 640px; height: 250px; border-radius: 26px; background: var(--rouge-pale); border: 7px solid var(--rouge);
  box-shadow: 0 16px 40px rgba(0,0,0,.35); overflow: hidden; padding: 34px 38px; }
.l { height: 30px; border-radius: 15px; background: #F5C6C7; }
/* gros X rouge */
#x { left: 200px; top: 310px; width: 360px; height: 360px; transform: rotate(-3deg); }
/* Patrick */
#face { right: -90px; bottom: -340px; height: 1060px; filter: drop-shadow(0 0 0 #fff) drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(0 24px 50px rgba(0,0,0,.5)); }
#glow { right: 40px; top: 60px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(244,156,22,.55) 0, rgba(244,156,22,0) 70%); }
.br { position: absolute; width: 80px; height: 80px; border: 0 solid var(--jaune); }
</style>
</head>
<body>
  <div class="abs" id="glow"></div>
  <img class="abs" id="face" src="assets/patrick-nobg.png">
  <div class="br" style="right:30px; top:30px; border-width:22px 22px 0 0"></div>

  <div class="abs" id="word">EFFACÉ</div>
  <div class="abs" id="card">
    <div id="bar">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#31249F" stroke-width="3" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l5.5 5.5"/></svg>
      Votre nom
    </div>
    <div id="res">
      <div class="l" style="width:220px; height:20px; background:#E9B3B5"></div>
      <div class="l" style="width:500px; height:44px; background:var(--rouge); margin-top:22px"></div>
      <div class="l" style="width:540px; margin-top:24px"></div>
      <div class="l" style="width:420px; margin-top:16px"></div>
    </div>
  </div>
  <svg class="abs" id="x" viewBox="0 0 100 100"><path d="M14 14L86 86M86 14L14 86" stroke="#fff" stroke-width="26" stroke-linecap="round"/><path d="M14 14L86 86M86 14L14 86" stroke="#E5484D" stroke-width="17" stroke-linecap="round"/></svg>
</body>
</html>
