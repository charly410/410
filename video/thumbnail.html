<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Miniature déréférencement</title>
<style>
@font-face { font-family: 'Inter'; src: url('assets/inter-latin.woff2') format('woff2'); font-weight: 100 900; }
:root { --jaune: #F49C16; --bleu: #31249F; --bleu-fonce: #1F1672; --noir: #15131F; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { font-family: 'Inter', sans-serif; position: relative;
  background:
    radial-gradient(ellipse 520px 460px at 300px 330px, rgba(91,77,209,.55), transparent 70%),
    radial-gradient(ellipse 700px 500px at 980px 380px, rgba(49,36,159,.45), transparent 70%),
    #0E0B2A; }
.abs { position: absolute; }

/* 1. Le visage : cadrage serré, lumière de contour jaune, pas de détourage blanc */
#face { left: -60px; top: -60px; height: 1320px;
  filter: contrast(1.06) saturate(1.05) drop-shadow(-3px -2px 4px rgba(244,156,22,.5)) drop-shadow(0 30px 60px rgba(0,0,0,.6)); }
#fadeBottom { left: 0; bottom: 0; width: 1280px; height: 180px; background: linear-gradient(rgba(14,11,42,0), #0E0B2A 95%); }

/* 2. Un seul objet : le résultat Google caviardé */
#card { left: 620px; top: 300px; width: 600px; padding: 34px 40px 40px; border-radius: 26px; background: #fff;
  transform: perspective(1400px) rotateY(-16deg) rotateX(5deg) rotate(-1deg);
  box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.4); }
.src { display: flex; align-items: center; gap: 14px; }
.fav { width: 40px; height: 40px; border-radius: 50%; background: #E9E7F2; }
.dom { font-size: 22px; font-weight: 600; color: #3A3748; line-height: 1.2; }
.dom small { display: block; font-size: 18px; color: #6E6B7E; font-weight: 500; }
.ttl { position: relative; margin-top: 18px; font-size: 38px; font-weight: 700; color: #1A0DAB; line-height: 1.2; }
.redact { position: absolute; left: -8px; top: 42px; width: 470px; height: 58px; background: var(--noir); border-radius: 6px; transform: rotate(-1.2deg); }
.desc { margin-top: 18px; height: 18px; width: 470px; border-radius: 9px; background: #E3E1EC; }

/* 3. Deux mots */
#word { left: 620px; top: 70px; font-size: 104px; font-weight: 900; letter-spacing: -0.055em; line-height: .95; color: #fff; }
#word span { color: var(--jaune); }
</style>
</head>
<body>
  <img class="abs" id="face" src="assets/patrick-nobg.png">
  <div class="abs" id="fadeBottom"></div>

  <div class="abs" id="word">Introuvable<span>.</span></div>

  <div class="abs" id="card">
    <div class="src"><div class="fav"></div><div class="dom">vieux-journal.fr<small>https://vieux-journal.fr › 2014</small></div></div>
    <div class="ttl">Prénom Nom<br>l'affaire de 2014<div class="redact"></div></div>
    <div class="desc"></div>
    <div class="desc" style="width:380px; margin-top:12px"></div>
  </div>
</body>
</html>
