<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #a-q { position: absolute; left: 620px; top: 140px; font-size: 30px; }
        #a-titre { position: absolute; left: 620px; top: 186px; font-size: 60px; }
        .a-code { top: 330px; height: 520px; padding: 44px 48px; }
        .a-code .n { font-family: "Montserrat", sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
        .a-code .lib { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 40px; margin-top: 18px; }
        .a-code .jauge { position: absolute; left: 48px; right: 48px; bottom: 110px; height: 26px; border-radius: 13px; background: var(--ligne); overflow: hidden; }
        .a-code .jauge div { height: 100%; width: 0; border-radius: 13px; }
        .a-code .jl { position: absolute; left: 48px; bottom: 60px; font-size: 26px; font-weight: 600; color: var(--gris); }
        #a-404 { left: 640px; width: 500px; }
        #a-404 .n { font-size: 190px; color: #8a93b5; }
        #a-404 .lib { color: var(--gris); }
        #a-410 { left: 1180px; width: 640px; }
        #a-410 .n { font-size: 230px; color: var(--indigo); }
        #a-410 .lib { color: var(--profond); }
        #a-def { left: 1560px; top: 296px; transform-origin: 50% 50%; }
        #a-vite { left: 1180px; top: 880px; }
        #a-logo { position: absolute; left: 820px; top: 300px; width: 900px; }
        #a-voile { position: absolute; left: 600px; top: 120px; width: 1320px; height: 900px; background: rgba(247, 245, 250, 0.92); }
      </style>
      <div id="root" data-composition-id="signal-410" data-width="1920" data-height="1080">
        <div class="sous" id="a-q">Que devient la page ?</div>
        <div class="titre" id="a-titre">Supprimée pour de bon</div>
        <div class="carte a-code" id="a-404">
          <div class="n">404</div>
          <div class="lib">« Introuvable »</div>
          <div class="jauge"><div id="a-j404" style="background: var(--cool)"></div></div>
          <div class="jl">Force du signal</div>
        </div>
        <div class="carte a-code" id="a-410">
          <div class="n">410</div>
          <div class="lib">« Supprimée »</div>
          <div class="jauge"><div id="a-j410" style="background: var(--orange)"></div></div>
          <div class="jl">Force du signal</div>
        </div>
        <div class="badge i" id="a-def">Définitivement</div>
        <div class="badge o" id="a-vite">Pris en compte plus vite</div>
        <div id="a-voile"></div>
        <img id="a-logo" src="assets/logo-410gone-couleur.svg" alt="" />
      </div>
      <script>
        (function () {
          const T = (v) => v + 2.64 - 30.8;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t) => tl.fromTo(s, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
          // « La page est supprimée et ne reviendra pas ? »
          rise("#a-q", 0.1);
          rise("#a-titre", T(28.78));
          // « Le bon signal, c'est le code 410 » : la carte 410 arrive seule, au centre
          tl.fromTo("#a-410", { opacity: 0, x: -270, scale: 0.8 }, { opacity: 1, x: -270, scale: 1.05, duration: 0.6, ease: "back.out(1.5)" }, T(32.3));
          // « Une 404 dit seulement à Google introuvable » : la 410 se range à droite, la 404 entre à gauche
          tl.to("#a-410", { x: 0, scale: 1, duration: 0.6, ease: "power3.inOut" }, T(33.7));
          rise("#a-404", T(34.0));
          tl.fromTo("#a-404 .lib", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T(35.9));
          tl.fromTo("#a-410 .lib", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T(39.2));
          // « définitivement »
          tl.fromTo("#a-def", { opacity: 0, scale: 2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.45, ease: "back.out(1.6)" }, T(40.5));
          // « Un signal plus fort, qu'il prend en compte plus vite »
          tl.fromTo("#a-j404", { width: "0%" }, { width: "38%", duration: 0.7, ease: "power2.out" }, T(42.1));
          tl.fromTo("#a-j410", { width: "0%" }, { width: "92%", duration: 0.9, ease: "power2.out" }, T(42.3));
          rise("#a-vite", T(43.5));
          // « Eh oui, c'est aussi le nom de notre agence »
          tl.fromTo("#a-voile", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T(45.5));
          tl.fromTo("#a-logo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, T(45.6));
          tl.to(["#a-logo", "#a-voile"], { opacity: 0, duration: 0.3 }, T(47.0));
          window.__timelines["signal-410"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
