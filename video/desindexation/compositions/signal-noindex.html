<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #c-q { position: absolute; left: 620px; top: 140px; font-size: 30px; }
        #c-titre { position: absolute; left: 620px; top: 186px; font-size: 60px; }
        .c-qui { left: 640px; width: 460px; height: 120px; display: flex; align-items: center; gap: 24px; padding: 0 30px; }
        .c-qui .titre { font-size: 36px; }
        .c-ico { width: 64px; height: 64px; flex: none; }
        .c-etat { margin-left: auto; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; }
        #c-visiteurs { top: 320px; }
        #c-moteurs { top: 460px; }
        .c-code { position: absolute; left: 1150px; width: 690px; background: var(--profond); border-radius: 20px; padding: 26px 32px; box-shadow: 0 18px 50px rgba(32, 26, 100, 0.25); }
        .c-code .barre-f { display: flex; gap: 10px; margin-bottom: 20px; }
        .c-code .barre-f i { width: 16px; height: 16px; border-radius: 50%; background: #9a8ff0; opacity: 0.6; }
        .c-code .ligne { font-size: 25px; color: #c9c4f5; white-space: nowrap; line-height: 1.7; }
        .c-code .forte { color: #ffffff; }
        .c-code .cle { color: var(--orange); font-weight: 700; }
        #c-html { top: 300px; height: 280px; }
        #c-meta { overflow: hidden; display: inline-block; vertical-align: bottom; width: 0; }
        #c-http { top: 640px; height: 280px; }
        .c-fichier { top: 650px; width: 200px; height: 250px; display: grid; place-items: center; }
        .c-fichier .titre { font-size: 40px; }
        #c-pdf { left: 640px; }
        #c-img { left: 880px; }
        #c-sans { left: 660px; top: 920px; }
      </style>
      <div id="root" data-composition-id="signal-noindex" data-width="1920" data-height="1080">
        <div class="sous" id="c-q">Que devient la page ?</div>
        <div class="titre" id="c-titre">En ligne, mais hors de Google</div>
        <div class="carte c-qui" id="c-visiteurs">
          <svg class="c-ico" viewBox="0 0 24 24" fill="#31249f"><circle cx="9" cy="7" r="4" /><path d="M1 21c0-4.4 3.6-8 8-8s8 3.6 8 8z" /><circle cx="18" cy="8" r="3" opacity=".6" /><path d="M15 13.5c3.6-.8 8 1.6 8 7.5h-5" opacity=".6" /></svg>
          <span class="titre">Visiteurs</span>
          <span class="c-etat" style="background: var(--indigo)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffb400" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span>
        </div>
        <div class="carte c-qui" id="c-moteurs">
          <svg class="c-ico" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="4" fill="#31249f" /><circle cx="9.5" cy="12" r="1.8" fill="#ffb400" /><circle cx="14.5" cy="12" r="1.8" fill="#ffb400" /><path d="M12 2v4" stroke="#201a64" stroke-width="2" /></svg>
          <span class="titre">Moteurs</span>
          <span class="c-etat" style="background: var(--orange)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#201a64" stroke-width="3.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg></span>
        </div>
        <div class="c-code" id="c-html">
          <div class="barre-f"><i></i><i></i><i></i></div>
          <div class="ligne mono">&lt;head&gt;</div>
          <div class="ligne mono">&nbsp;&nbsp;&lt;title&gt;Ma page&lt;/title&gt;</div>
          <div class="ligne mono">&nbsp;&nbsp;<span id="c-meta" class="forte">&lt;meta name="robots" content="<span class="cle">noindex</span>"&gt;</span></div>
          <div class="ligne mono">&lt;/head&gt;</div>
        </div>
        <div class="carte c-fichier" id="c-pdf"><span class="titre">PDF</span></div>
        <div class="carte c-fichier" id="c-img">
          <svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#31249f" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="9" cy="9.5" r="2" fill="#ffb400" stroke="none" /><path d="M3 17l5-5 4 4 3-3 6 6" /></svg>
        </div>
        <div class="badge b" id="c-sans">Pas de code HTML</div>
        <div class="c-code" id="c-http">
          <div class="barre-f"><i></i><i></i><i></i></div>
          <div class="ligne mono">HTTP/1.1 200 OK</div>
          <div class="ligne mono">Content-Type: application/pdf</div>
          <div class="ligne mono forte" id="c-xrt"><span class="cle">X-Robots-Tag: noindex</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T = (v) => v + 2.64 - 59.6;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t) => tl.fromTo(s, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
          rise("#c-q", 0.05);
          rise("#c-titre", 0.2);
          // « Vos visiteurs doivent toujours y accéder, mais pas les moteurs de recherche ? »
          rise("#c-visiteurs", T(57.5));
          rise("#c-moteurs", T(59.8));
          // « Ajoutez une balise noindex »
          rise("#c-html", T(61.1));
          tl.fromTo("#c-meta", { width: 0 }, { width: 590, duration: 0.9, ease: "steps(36)" }, T(61.5));
          // « Pour un PDF ou une image, qui n'ont pas de code HTML »
          rise("#c-pdf", T(63.7));
          rise("#c-img", T(64.4));
          rise("#c-sans", T(65.6));
          // « le même ordre passe par un en-tête HTTP : X-Robots-Tag »
          rise("#c-http", T(67.8));
          tl.fromTo("#c-xrt", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4 }, T(69.7));
          window.__timelines["signal-noindex"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
